# LTX-2.5 I2V LoRA - Pudgy characters, standalone experiment.
#
# Derived from the trainer's shipped configs/i2v_lora.yaml. Every value that differs from
# the shipped default carries the reason inline. Paths are placeholders: set MODELS and
# DATA on the box.
#
# Preprocess FIRST, into a FRESH .precomputed (Gemma-4 embeddings are not interchangeable
# with Gemma-3 and stale conditions/*.pt are SKIPPED SILENTLY, not rejected):
#
#   uv run accelerate launch --num_processes 2 --mixed_precision bf16 \
#     scripts/process_dataset.py <DATA>/dataset.json \
#       --resolution-buckets "1024x1024x1;1024x1024x17;1024x1024x25;1024x1024x33" \
#       --model-path        <MODELS>/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors \
#       --text-encoder-path <MODELS>/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors \
#       --video-vae-path    <MODELS>/vae/ltx-2.5-video-vae-bf16.safetensors \
#       --audio-vae-path    <MODELS>/vae/ltx-2.5-audio-vae-bf16.safetensors \
#       --skip-audio --decode
#
#   The exact bucket string is written to manifest.json by prep_ltx25.py - use that, not this
#   comment, since it reflects what was actually emitted.
#   --decode writes .precomputed/decoded_videos. EYEBALL THOSE before spending a GPU-hour.
#   Do NOT pass --lora-trigger: captions already carry pxngn0/plngn0 per clip, and that flag
#   prepends to ALL captions, which would stamp Pax's token onto Polly-only clips.
#   Do NOT pass a version flag: model version detection is automatic.

seed: 42
output_dir: "outputs/ltx25_pudgy_i2v"

model:
  # bf16, NOT fp8. LTX-2 #165: training from an fp8 checkpoint outputs pure noise.
  model_path:        "<MODELS>/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors"
  # Must be LTX's FINE-TUNED Gemma 4, not Google's vanilla Gemma 4. The trainer validates
  # this against the checkpoint's gemma_source_checkpoint metadata.
  text_encoder_path: "<MODELS>/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
  video_vae_path:    "<MODELS>/vae/ltx-2.5-video-vae-bf16.safetensors"   # required on a split pack
  training_mode:     "lora"

lora:
  # 32/32 is the vendor's prescription for a character or style LoRA (mode-selector.md:
  # 32-64 for character/style, 8-16 for motion because "high ranks just memorise frame
  # content"). ONE LoRA is deliberate: v7's motion/expression split exists because Wan2.2
  # is a mixture of experts, and LTX has no expert split, so that argument does not
  # transfer. Split into two only if per-label eval shows the two interfering.
  rank: 32
  alpha: 32          # vendor guidance: alpha == rank unless there is a reason
  dropout: 0.0
  # The documented video-only set. Matches what previous LTX work here measured as best.
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"

training_strategy:
  name: "flexible"
  video:
    is_generated: true
    latents_dir: "latents"
    conditions:
      # 0.5 yields a T2V/I2V superset from one run. Production always supplies a start
      # frame, but the text-only fallback is free and covers requests the pose library
      # does not have. NOTE (LTX-2 #255, maintainer): first-frame conditioning is NOT an
      # identity encoder and will not hold identity through large motion. The LoRA has to
      # carry identity; the start frame only anchors the opening.
      - type: first_frame
        probability: 0.5
  # audio block deliberately ABSENT - the corpus is silent.

data:
  preprocessed_data_root: "<DATA>/.precomputed"
  num_dataloader_workers: 2

optimization:
  learning_rate: 1.0e-4          # vendor range 1e-5..1e-3; drop to 5e-5 on oversaturation
  steps: 3000
  batch_size: 1                  # REQUIRED: the dataset mixes F=1 stills with video
  gradient_accumulation_steps: 4 # effective batch 4, since batch_size is pinned to 1
  optimizer_type: "adamw"
  scheduler_type: "linear"
  max_grad_norm: 1.0
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  # Leave quantization OFF. LTX-2 #296/#253: `fp8-cast` crashes with ANY LoRA on
  # pre-Hopper GPUs, and A100 is Ampere. At 1024x1024x17 = 3,072 tokens there is ample
  # headroom on 80GB, so there is nothing to buy here.
  quantization: null
  load_text_encoder_in_8bit: false

validation:
  video_dims: [1024, 1024, 17]   # MUST equal a preprocessed bucket
  frame_rate: 24.0
  inference_steps: 30
  generate_audio: false          # SETTLED off. Trainer default is TRUE and would attempt
                                 # audio on a silent corpus.
  generate_video: true
  video_cfg_scale: 3.0
  # STG off. LTX-2 #301: DDP validation crashes on transformer.num_blocks when STG is
  # enabled, and this run may use 2 GPUs.
  video_stg_scale: 0.0
  guidance_rescale: 0.7
  seed: 42
  interval: 250
  samples:
    - prompt: "pxngn0, Pax, a short round blue penguin. 2D cartoon animation in the Pudgy Penguins style, thick clean black outlines, flat pastel colors, cel shading; raising one flipper and waving it back and forth in greeting, the other flipper resting at its side; waving; static medium shot, eye level, facing the camera directly, front view; plain teal background."
    - prompt: "plngn0, Polly, a short round pink penguin. 2D cartoon animation in the Pudgy Penguins style, thick clean black outlines, flat pastel colors, cel shading; crouching down and then hopping straight up, flippers spreading out wide, feet tucking under as it leaves the ground, then landing and settling back down; jump cycle; static wide shot, eye level, turned slightly to its left, three-quarter front view; plain slate background."

checkpoints:
  interval: 250
  # -1, NOT the default 3. Fidelity has peaked mid-run on this project before, and the
  # default would silently discard exactly those checkpoints.
  keep_last_n: -1
  precision: "bfloat16"
  save_training_state: "minimal"

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"

# ⚠️ DO NOT select checkpoints from this run's own validation samples.
# LTX-2 #283 (OPEN, acknowledged): the trainer's validation runner diverges from training
# on the sigma schedule, never sets keyframes_mask (which training omits and inference
# always sets - and that is exactly our first_frame mode), and uses the opposite token
# order. Render checkpoints through ltx-pipelines and score those. See docs/PIPELINE.md 10.3.
