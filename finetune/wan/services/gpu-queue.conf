[program:gpu-queue]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/gpu-queue.sh
autostart=true
autorestart=true
startsecs=10
stopasgroup=false
killasgroup=false
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
